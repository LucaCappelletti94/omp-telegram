# SonarQube Cloud analysis configuration. The organization and project keys
# come from the SonarQube Cloud project import and must match it exactly.
sonar.organization=lucacappelletti94-github
sonar.projectKey=LucaCappelletti94_omp-telegram
sonar.projectName=omp-telegram

# The extension, its renderer and the setup wizard are the whole product.
sonar.sources=index.ts,render.ts,setup.mjs
sonar.tests=test
sonar.sourceEncoding=UTF-8

# One c8 run covers every suite, so this single report is the complete picture.
# The property name covers TypeScript as well as JavaScript.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# index.ts drives the session from inside a tmux server, so invoking tmux and its
# helper shell by name off PATH is deliberate and portable across installs.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.e1.resourceKey=**/index.ts
